<svg class="vA-circuit" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vA-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".4" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="vA-mask">
      <rect width="1200" height="700" fill="url(#vA-fade)" />
    </mask>
  </defs>
  <g mask="url(#vA-mask)">
    <!-- grid -->
    <line x1="0" x2="1200" y1="80"  y2="80"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="160" y2="160" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="240" y2="240" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="320" y2="320" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="400" y2="400" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="480" y2="480" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="560" y2="560" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line x1="0" x2="1200" y1="640" y2="640" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="80"   x2="80"   stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="160"  x2="160"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="240"  x2="240"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="320"  x2="320"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="400"  x2="400"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="480"  x2="480"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="560"  x2="560"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="640"  x2="640"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="720"  x2="720"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="800"  x2="800"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="880"  x2="880"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="960"  x2="960"  stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="1040" x2="1040" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="1120" x2="1120" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <line y1="0" y2="700" x1="1200" x2="1200" stroke="#2ABBAD" stroke-width=".5" opacity=".08" />
    <!-- circuit traces -->
    <path class="line"   d="M-20 180 H 240 Q 280 180 280 220 V 360 Q 280 400 320 400 H 560" />
    <path class="line"   d="M0 540 H 180 Q 220 540 220 500 V 420 Q 220 380 260 380 H 460 Q 500 380 500 340 V 220 Q 500 180 540 180 H 760" />
    <path class="line-b" d="M820 60 V 200 Q 820 240 860 240 H 1080 Q 1120 240 1120 280 V 480" />
    <path class="line"   d="M1240 360 H 1000 Q 960 360 960 400 V 560 Q 960 600 1000 600 H 1240" />
    <path class="line"   d="M380 700 V 580 Q 380 540 420 540 H 640" />
    <!-- nodes -->
    <circle class="node"   cx="240"  cy="180" r="4.5" />
    <circle class="node"   cx="280"  cy="360" r="4.5" />
    <circle class="node"   cx="320"  cy="400" r="4.5" />
    <circle class="node-b" cx="560"  cy="400" r="4.5" />
    <circle class="node"   cx="180"  cy="540" r="4.5" />
    <circle class="node"   cx="220"  cy="420" r="4.5" />
    <circle class="node"   cx="460"  cy="380" r="4.5" />
    <circle class="node"   cx="500"  cy="340" r="4.5" />
    <circle class="node-b" cx="540"  cy="180" r="4.5" />
    <circle class="node"   cx="760"  cy="180" r="4.5" />
    <circle class="node"   cx="820"  cy="200" r="4.5" />
    <circle class="node"   cx="1080" cy="240" r="4.5" />
    <circle class="node"   cx="1120" cy="480" r="4.5" />
    <circle class="node"   cx="1000" cy="360" r="4.5" />
    <circle class="node"   cx="1000" cy="600" r="4.5" />
    <circle class="node"   cx="960"  cy="400" r="4.5" />
    <circle class="node"   cx="380"  cy="580" r="4.5" />
    <circle class="node"   cx="420"  cy="540" r="4.5" />
    <circle class="node"   cx="640"  cy="540" r="4.5" />
    <!-- travelling pulses -->
    <circle class="pulse-dot" r="3.5">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M-20 180 H 240 Q 280 180 280 220 V 360 Q 280 400 320 400 H 560" />
    </circle>
    <circle class="pulse-dot" r="3" fill="#FBAF03">
      <animateMotion dur="9s" repeatCount="indefinite" begin="1s"
        path="M820 60 V 200 Q 820 240 860 240 H 1080 Q 1120 240 1120 280 V 480" />
    </circle>
    <circle class="pulse-dot" r="2.8">
      <animateMotion dur="7s" repeatCount="indefinite" begin="2s"
        path="M0 540 H 180 Q 220 540 220 500 V 420 Q 220 380 260 380 H 460 Q 500 380 500 340 V 220 Q 500 180 540 180 H 760" />
    </circle>
  </g>
</svg>
